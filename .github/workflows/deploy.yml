# Deploy a Cloudflare Workers (build en Linux — OpenNext no soporta Windows)
# Requiere los secrets CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID en el repo.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    # Dormido hasta que existan los secrets: crear la variable de repo
    # DEPLOY=true (Settings → Secrets and variables → Actions → Variables)
    # después de cargar CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
    if: vars.DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar Prisma Client
        run: pnpm --filter @mnemo/db exec prisma generate

      - name: Bundle de Cloudflare Workers (OpenNext)
        run: pnpm --filter @mnemo/web exec opennextjs-cloudflare build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
