name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # la versión vive en packageManager (package.json): una sola fuente de verdad

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar Prisma Client
        run: pnpm --filter @mnemo/db exec prisma generate

      - name: Tests del dominio (Vitest)
        run: pnpm test

      - name: Typecheck (domain + web)
        run: |
          pnpm --filter @mnemo/domain exec tsc --noEmit
          pnpm --filter @mnemo/web exec tsc --noEmit

      - name: Build de producción (Next.js)
        run: pnpm build

      # El bundle de Workers se arma con OpenNext, que crea symlinks del store
      # de pnpm (imposible en Windows sin admin). En Linux/CI vuela — y valida
      # la migración a Cloudflare en cada push.
      - name: Bundle de Cloudflare Workers (OpenNext)
        run: pnpm --filter @mnemo/web exec opennextjs-cloudflare build

      # Dry-run sin auth: valida que wrangler acepte la config y encuentre
      # el bundle (entry + assets). El deploy real lo hace deploy.yml.
      - name: Validar deploy (wrangler dry-run)
        run: pnpm --filter @mnemo/web exec wrangler deploy --dry-run
