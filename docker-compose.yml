services:
  postgres:
    image: postgres:16-alpine
    container_name: mnemo-postgres
    environment:
      POSTGRES_USER: mnemo
      POSTGRES_PASSWORD: mnemo
      POSTGRES_DB: mnemo
    ports:
      - "5432:5432"
    volumes:
      - mnemo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mnemo -d mnemo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mnemo_pgdata:
