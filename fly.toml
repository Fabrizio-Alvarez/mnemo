# Fly.io — configuración lista para `fly launch`.
# Pasos (una sola vez, ver CONTEXTO.md §Deploy):
#   fly auth login && fly launch --no-deploy && fly postgres create --name mnemo-pg
#   fly postgres attach mnemo-pg   (setea DATABASE_URL como secret)
#   fly deploy
app = "mnemo"
primary_region = "eze"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/"
    interval = "10s"
    timeout = "2s"
